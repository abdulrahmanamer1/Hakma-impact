{% extends "base.html" %}{% block content %}
<div class="page-head"><div><span class="eyebrow dark">TASK CONTROL</span><h1>{{ 'تعديل مهمة' if t else 'إضافة مهمة' }}</h1></div></div>
<form method="post" class="form-card"><div class="form-grid">
<div class="field full"><label>عنوان المهمة</label><input name="title" value="{{ t['title'] if t else '' }}" required></div>
<div class="field"><label>المسؤول</label><select name="assignee"><option value="">— اختر المسؤول —</option><optgroup label="الأعضاء">{% for m in members %}<option value="member:{{m.id}}" {% if t and t.assignee==m.name %}selected{% endif %}>{{m.name}} — عضو</option>{% endfor %}</optgroup><optgroup label="الإداريون">{% for a in admins %}<option value="admin:{{a.id}}" {% if t and t.assignee==a.name %}selected{% endif %}>{{a.name}} — إداري</option>{% endfor %}</optgroup></select></div>
<div class="field"><label>الموعد</label><input type="date" name="deadline" value="{{ t['deadline'] if t else '' }}"></div>
<div class="field"><label>الأولوية</label><select name="priority">{% for p in ['منخفضة','متوسطة','عالية'] %}<option {{ 'selected' if t and t['priority']==p else '' }}>{{ p }}</option>{% endfor %}</select></div>
<div class="field"><label>الحالة</label><select name="status">{% for s in ['Todo','In Progress','Completed','Overdue'] %}<option {{ 'selected' if t and t['status']==s else '' }}>{{ s }}</option>{% endfor %}</select></div>
<div class="field full"><label>الوصف</label><textarea name="description">{{ t['description'] if t else '' }}</textarea></div>
</div>
<label class="switch"><input type="checkbox" id="mapVisible" name="map_visible" {% if t and t['map_visible'] %}checked{% endif %}><i></i> ربط المهمة بموقع (اختياري)</label>
<div id="taskMapWrap" class="map-wrap {% if not t or not t['map_visible'] %}hidden{% endif %}"><div id="taskMap" class="map-picker"></div><div class="map-help">اسحب السهم إلى الموقع المطلوب. لا تحتاج لإدخال خط الطول والعرض يدويًا.</div><input type="hidden" name="latitude" id="taskLat" value="{{t['latitude'] if t and t['latitude'] is not none else ''}}"><input type="hidden" name="longitude" id="taskLng" value="{{t['longitude'] if t and t['longitude'] is not none else ''}}"></div>
<div class="form-actions"><button class="primary" type="submit">حفظ</button><a class="secondary" href="{{ url_for('tasks_list') }}">إلغاء</a></div></form>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
(()=>{const cb=document.getElementById('mapVisible'),wrap=document.getElementById('taskMapWrap');let map,marker;function init(){if(map)return;map=L.map('taskMap').setView([33.3152,44.3661],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);const lat=parseFloat(document.getElementById('taskLat').value)||33.3152,lng=parseFloat(document.getElementById('taskLng').value)||44.3661;marker=L.marker([lat,lng],{draggable:true}).addTo(map);marker.on('dragend',sync);map.on('click',e=>{marker.setLatLng(e.latlng);sync()});sync()}function sync(){const p=marker.getLatLng();document.getElementById('taskLat').value=p.lat.toFixed(6);document.getElementById('taskLng').value=p.lng.toFixed(6)}cb.addEventListener('change',()=>{wrap.classList.toggle('hidden',!cb.checked);if(cb.checked){setTimeout(()=>{init();map.invalidateSize()},80)}});if(cb.checked)setTimeout(init,50)})();</script>
{% endblock %}
