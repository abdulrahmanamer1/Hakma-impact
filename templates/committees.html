{% extends "base.html" %}{% block content %}<div class="container page"><div class="page-head"><h1>اللجان</h1>{% if is_admin %}<a class="btn" href="{{url_for('committee_new')}}">+ إضافة لجنة</a>{% endif %}</div><div class="cards">{% for c in rows %}<article class="info-card"><h3>{{c.name}}</h3><strong>{{c.head or "—"}}</strong><p>{{c.description or ""}}</p>{% if is_admin %}<form method="post" action="{{url_for('committee_delete',cid=c.id)}}"><button class="danger-link">حذف</button></form>{% endif %}</article>{% else %}<div class="empty">لا توجد لجان.</div>{% endfor %}</div></div>{% endblock %}
