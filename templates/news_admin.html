{% extends "base.html" %}{% block content %}<div class="page-head"><div><h1>الأخبار والنشر</h1><p>إنشاء ومسودات ونشر المحتوى.</p></div><a class="primary" href="{{url_for('news_new')}}">+ خبر جديد</a></div><div class="table-wrap"><table><thead><tr><th>العنوان</th><th>التصنيف</th><th>الحالة</th><th>التاريخ</th><th>إجراءات</th></tr></thead><tbody>{% for n in news %}<tr><td>{{n['title']}}</td><td>{{n['category']}}</td><td><span class="badge">{{n['status']}}</span></td><td>{{n['created_at']|fmt_date}}</td><td><a class="small-btn" href="{{url_for('news_edit',nid=n['id'])}}">تعديل</a><form method="post" action="{{url_for('news_delete',nid=n['id'])}}" style="display:inline"><button class="small-btn danger">حذف</button></form></td></tr>{% endfor %}</tbody></table></div>{% endblock %}
