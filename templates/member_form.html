{% extends "base.html" %}{% block content %}<div class="container form-page"><div class="page-head"><h1>إضافة عضو</h1></div><form class="form-card" method="post" enctype="multipart/form-data"><div class="form-grid"><label>الاسم<input name="name" required></label><label>البريد<input name="email" type="email"></label><label>الهاتف<input name="phone"></label><label>اللجنة<input name="committee"></label><label>المنصب<input name="position" value="عضو"></label><label>تاريخ الانضمام<input name="join_date" type="date"></label><label>الحالة<select name="status"><option>Active</option><option>Inactive</option></select></label><label class="wide">الصورة الشخصية<input name="photo" type="file" accept="image/*"></label><label class="wide">ملاحظات<textarea name="notes"></textarea></label></div><button class="btn">حفظ العضو</button></form></div>{% endblock %}
