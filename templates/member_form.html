{% extends "base.html" %}
{% block content %}
<div class="page-head"><div><h1>{{ 'تعديل عضو' if member else 'إضافة عضو' }}</h1></div></div>
<form method="post" enctype="multipart/form-data" class="form-card">
  <div class="form-grid">
    <div class="field"><label>الاسم الكامل</label><input name="name" value="{{ member['name'] if member else '' }}" required></div>
    <div class="field"><label>البريد الإلكتروني</label><input name="email" type="email" value="{{ member['email'] if member else '' }}"></div>
    <div class="field"><label>رقم الهاتف (اختياري)</label><input name="phone" value="{{ member['phone'] if member else '' }}"></div>
    <div class="field"><label>اللجنة</label>
      <select name="committee">
        <option value="">—</option>
        {% for c in committees %}<option {{ 'selected' if member and member['committee']==c['name'] else '' }}>{{ c['name'] }}</option>{% endfor %}
      </select>
    </div>
    <div class="field"><label>المنصب</label><input name="position" value="{{ member['position'] if member else 'عضو' }}"></div>
    <div class="field"><label>تاريخ الانضمام</label><input type="date" name="join_date" value="{{ member['join_date'] if member else '' }}"></div>
    <div class="field"><label>حالة العضوية</label>
      <select name="status">
        <option value="Active" {{ 'selected' if not member or member['status']=='Active' else '' }}>Active</option>
        <option value="Inactive" {{ 'selected' if member and member['status']=='Inactive' else '' }}>Inactive</option>
      </select>
    </div>
    <div class="field full"><label>ملاحظات</label><textarea name="notes">{{ member['notes'] if member else '' }}</textarea></div>
  </div>
  <div class="upload-box"><label>👤 الصورة الشخصية</label><input type="file" name="photo_file" accept="image/*"></div><div class="form-actions">
    <button class="primary" type="submit">حفظ العضو</button>
    <a class="secondary" href="{{ url_for('members_list') }}">إلغاء</a>
  </div>
</form>
{% endblock %}
