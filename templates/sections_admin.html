{% extends 'base.html' %}{% block content %}<div class="page-head"><div><h1>🎬 مخرج الصفحة السينمائية</h1><p>رتّب مستويات الصفحة الرئيسية وأظهر أو أخفِ أي مستوى.</p></div></div><form method="post" class="card panel">{% for s in sections %}<input type="hidden" name="section_id" value="{{s['id']}}"><div class="drag-row"><span class="grip">☷</span><b style="width:120px">{{s['section_key']}}</b><input style="flex:1" name="title_{{s['id']}}" value="{{s['title']}}"><select name="background_{{s['id']}}"><option value="light" {% if s['background']=='light' %}selected{% endif %}>Light</option><option value="tint" {% if s['background']=='tint' %}selected{% endif %}>Tint</option><option value="dark" {% if s['background']=='dark' %}selected{% endif %}>Dark</option><option value="join" {% if s['background']=='join' %}selected{% endif %}>Gradient</option></select><label class="switch"><input type="checkbox" name="visible_{{s['id']}}" {% if s['visible'] %}checked{% endif %}><i></i></label></div>{% endfor %}<button class="primary">حفظ ترتيب الواجهة</button></form>{% endblock %}
