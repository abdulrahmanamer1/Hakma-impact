{% extends "base.html" %}
{% block content %}
<div class="page-head"><div><h1>{{ 'تعديل إداري' if a else 'إضافة إداري' }}</h1></div></div>
<form method="post" enctype="multipart/form-data" class="form-card">
  <div class="form-grid">
    <div class="field"><label>الاسم</label><input name="name" value="{{ a['name'] if a else '' }}" required></div>
    <div class="field"><label>المنصب</label><input name="position" value="{{ a['position'] if a else '' }}"></div>
    <div class="field"><label>اللجنة</label><select name="committee"><option value="">—</option>{% for c in committees %}<option value="{{c['name']}}" {{ 'selected' if a and a['committee']==c['name'] else '' }}>{{ c['name'] }}</option>{% endfor %}</select></div>
    <div class="field"><label>تاريخ التكليف</label><input type="date" name="date" value="{{ a['date'] if a else '' }}"></div>
    <div class="field full"><label>الصورة الشخصية</label><input type="file" name="photo_file" accept="image/*">{% if a and a['photo'] %}<small class="muted">الصورة الحالية محفوظة، اختر صورة جديدة لاستبدالها.</small>{% else %}<small class="muted">يمكن رفع JPG أو PNG أو WEBP.</small>{% endif %}</div>
    <div class="field full"><label>المسؤوليات</label><textarea name="responsibilities">{{ a['responsibilities'] if a else '' }}</textarea></div>
  </div>
  <div class="form-actions"><button class="primary" type="submit">حفظ</button><a class="secondary" href="{{ url_for('admins_list') }}">إلغاء</a></div>
</form>
{% endblock %}
