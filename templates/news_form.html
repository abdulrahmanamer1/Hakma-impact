{% extends "base.html" %}{% block content %}
<div class="page-head"><div><h1>{{'تعديل الخبر' if n else 'خبر جديد'}}</h1></div></div>
<form method="post" enctype="multipart/form-data" class="form-card">
<div class="field"><label>العنوان</label><input name="title" required value="{{n['title'] if n else ''}}"></div>
<div class="form-grid">
<div class="field"><label>الرابط المختصر</label><input name="slug" value="{{n['slug'] if n else ''}}"></div>
<div class="field"><label>التصنيف</label><input name="category" value="{{n['category'] if n else 'عام'}}"></div>
</div>
<div class="field"><label>ملخص</label><textarea name="excerpt">{{n['excerpt'] if n else ''}}</textarea></div>
<div class="field">
<label>صور المنشور</label>
<input name="images" type="file" accept="image/*" multiple>
<small class="muted">تقدر تختار صورة واحدة أو عدة صور مباشرة من جهازك. ما يحتاج أي رابط.</small>
{% if images %}
<div class="upload-preview">{% for img in images %}<img src="{{ url_for('static',filename=img) }}" alt="صورة المنشور">{% endfor %}</div>
{% endif %}
</div>
<div class="field"><label>رابط صورة الغلاف (اختياري للتوافق مع الصور القديمة)</label><input name="cover_image" value="{{n['cover_image'] if n else ''}}"></div>
<div class="field"><label>المحتوى</label><textarea name="content" style="min-height:240px">{{n['content'] if n else ''}}</textarea></div>
<div class="field"><label>الحالة</label><select name="status"><option value="draft" {{'selected' if n and n['status']=='draft'}}>مسودة</option><option value="published" {{'selected' if n and n['status']=='published'}}>منشور</option></select></div>
<div class="form-actions"><button class="primary">حفظ</button><a class="secondary" href="{{url_for('news_admin')}}">إلغاء</a></div>
</form>{% endblock %}
