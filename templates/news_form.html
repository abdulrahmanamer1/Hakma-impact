{% extends "base.html" %}{% block content %}<div class="container form-page"><h1>إضافة خبر</h1><form class="form-card" method="post" enctype="multipart/form-data"><label>العنوان<input name="title" required></label><label>الرابط المختصر<input name="slug" placeholder="اسم-الخبر"></label><label>التصنيف<input name="category" value="عام"></label><label>الحالة<select name="status"><option value="draft">مسودة</option><option value="published">منشور</option></select></label><label>الملخص<textarea name="excerpt"></textarea></label><label>محتوى المنشور<textarea name="content" rows="10"></textarea></label><label>الصور — عدة صور مسموحة<input name="images" type="file" accept="image/*" multiple></label><button class="btn">حفظ الخبر</button></form></div>{% endblock %}
