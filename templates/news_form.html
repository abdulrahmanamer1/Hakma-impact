{% extends "base.html" %}{% block content %}<div class="page-head"><div><h1>{{'تعديل الخبر' if n else 'خبر جديد'}}</h1><p>ارفع الصور مباشرة من جهازك — لا تحتاج إلى روابط.</p></div></div><form method="post" enctype="multipart/form-data" class="form-card"><div class="field"><label>العنوان</label><input name="title" required value="{{n['title'] if n else ''}}"></div><div class="form-grid"><div class="field"><label>الرابط المختصر</label><input name="slug" value="{{n['slug'] if n else ''}}"></div><div class="field"><label>التصنيف</label><input name="category" value="{{n['category'] if n else 'عام'}}"></div></div><div class="field"><label>ملخص</label><textarea name="excerpt">{{n['excerpt'] if n else ''}}</textarea></div><div class="upload-box"><label>📷 صورة الغلاف</label><input type="file" name="cover_file" accept="image/*"></div><div class="upload-box"><label>🖼️ صور إضافية — يمكنك اختيار أكثر من صورة</label><input type="file" name="gallery" accept="image/*" multiple></div><div class="field"><label>المحتوى</label><textarea name="content" style="min-height:240px">{{n['content'] if n else ''}}</textarea></div><div class="field"><label>الحالة</label><select name="status"><option value="draft" {{'selected' if n and n['status']=='draft'}}>مسودة</option><option value="published" {{'selected' if n and n['status']=='published'}}>منشور</option></select></div>{% if images %}<div class="gallery-grid small-gallery">{% for im in images %}<img src="{{url_for('static',filename=im['path'])}}">{% endfor %}</div>{% endif %}<div class="form-actions"><button class="primary">حفظ</button><a class="secondary" href="{{url_for('news_admin')}}">إلغاء</a></div></form>{% endblock %}
