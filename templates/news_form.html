{% extends "base.html" %}{% block content %}<div class="page-head"><div><h1>{{'تعديل الخبر' if n else 'خبر جديد'}}</h1><p>اكتب الخبر، حدّد تصنيفه، ويمكنك تمييزه أو جدولة نشره.</p></div></div><form method="post" class="form-card"><div class="field"><label>العنوان</label><input name="title" required value="{{n['title'] if n else ''}}"></div><div class="form-grid"><div class="field"><label>الرابط المختصر</label><input name="slug" value="{{n['slug'] if n else ''}}"></div><div class="field"><label>التصنيف</label><input name="category" value="{{n['category'] if n else 'عام'}}"></div></div><div class="field"><label>ملخص</label><textarea name="excerpt">{{n['excerpt'] if n else ''}}</textarea></div><div class="field"><label>رابط صورة الغلاف</label><input name="cover_image" value="{{n['cover_image'] if n else ''}}"></div><div class="field"><label>المحتوى</label><textarea name="content" style="min-height:240px">{{n['content'] if n else ''}}</textarea></div><div class="form-grid"><div class="field"><label>الحالة</label><select name="status"><option value="draft" {{'selected' if n and n['status']=='draft'}}>مسودة</option><option value="published" {{'selected' if n and n['status']=='published'}}>منشور</option></select></div><div class="field"><label>جدولة النشر (اختياري)</label><input type="datetime-local" name="scheduled_at" value="{{n['scheduled_at'][:16] if n and n['scheduled_at'] else ''}}"></div></div><label class="check-row"><input type="checkbox" name="featured" {% if n and n['featured'] %}checked{% endif %}> ⭐ خبر مميز</label><div class="form-actions"><button class="primary">حفظ</button><a class="secondary" href="{{url_for('news_admin')}}">إلغاء</a></div></form>{% endblock %}
