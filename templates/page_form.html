{% extends "base.html" %}{% block content %}<div class="page-head"><div><h1>{{'تعديل الصفحة' if page else 'إنشاء صفحة'}}</h1><p>يمكن لصانع التطبيق استخدام HTML مخصص هنا. لا تمنح هذا الوصول للأدمن العادي.</p></div></div><form method="post" class="form-card"><div class="field"><label>العنوان</label><input name="title" required value="{{page['title'] if page else ''}}"></div><div class="form-grid"><div class="field"><label>Slug</label><input name="slug" value="{{page['slug'] if page else ''}}"></div><div class="field"><label>ترتيب</label><input type="number" name="sort_order" value="{{page['sort_order'] if page else 0}}"></div></div><div class="field"><label>المحتوى</label><textarea name="content" style="min-height:320px">{{page['content'] if page else ''}}</textarea></div><div class="form-grid"><div class="field"><label>الحالة</label><select name="status"><option value="draft" {{'selected' if page and page['status']=='draft'}}>مسودة</option><option value="published" {{'selected' if page and page['status']=='published'}}>منشورة</option></select></div><label style="padding-top:24px"><input type="checkbox" name="show_in_nav" {{'checked' if page and page['show_in_nav']}}> إظهار في القائمة</label></div><div class="form-actions"><button class="primary">حفظ الصفحة</button><a class="secondary" href="{{url_for('page_admin')}}">إلغاء</a></div></form>{% endblock %}
