{% extends "base.html" %}{% block title %}الشركاء — {{ team_name }}{% endblock %}{% block content %}<div class="dashboard-topline"><div><span class="eyebrow dark">PARTNERS</span><h1>إدارة الشركاء</h1></div></div><form class="form-card" method="post"><div class="form-grid"><label>اسم الشريك<input name="name" required></label><label>الرابط<input name="url"></label><label>الشعار (مسار أو رابط)<input name="logo"></label><label>الترتيب<input name="sort_order" type="number" value="0"></label><label class="wide">الوصف<textarea name="description"></textarea></label></div><button class="primary-btn">إضافة</button></form><div class="cards-grid" style="padding:0;max-width:none">{% for p in partners %}<div class="info-card"><h3>{{ p.name }}</h3><p>{{ p.description }}</p></div>{% endfor %}</div>{% endblock %}
