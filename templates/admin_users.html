{% extends "base.html" %}{% block content %}<div class="container page"><div class="page-head"><div><span class="eyebrow">ACCESS</span><h1>حسابات الإداريين</h1></div>{% if is_creator %}<a class="btn" href="{{url_for('admin_user_new')}}">+ إنشاء حساب</a>{% endif %}</div><div class="cards">{% for u in users %}<article class="info-card"><h3>{{u.name}}</h3><p>{{u.email}}</p><span class="tag">{{u.role}}</span>{% if is_creator and u.email.lower()!= 'abdulrahman.a.alani1@gmail.com' %}<form method="post" action="{{url_for('admin_user_delete',uid_=u.id)}}"><button class="danger-link">حذف الحساب</button></form>{% endif %}</article>{% endfor %}</div></div>{% endblock %}
