{% extends "base.html" %}{% block content %}<div class="page-head"><div><h1>المستخدمون والصلاحيات</h1><p>الإدارة فقط تستطيع التعديل. صانع التطبيق وحده يغير صلاحيات الأدمن.</p></div></div><div class="table-wrap"><table><thead><tr><th>الاسم</th><th>البريد</th><th>الصلاحية</th><th>تغيير</th></tr></thead><tbody>{% for u in users %}<tr><td>{{u['name']}}</td><td>{{u['email']}}</td><td><span class="badge">{{u['role']}}</span></td><td>{% if is_creator %}<form method="post" action="{{url_for('admin_user_role',uid_=u['id'])}}"><select name="role" onchange="this.form.submit()"><option value="ADMIN" {{'selected' if u['role']=='ADMIN'}}>ADMIN</option><option value="CREATOR" {{'selected' if u['role'] in ('CREATOR','SUPER_ADMIN')}}>CREATOR</option></select></form>{% else %}—{% endif %}</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
