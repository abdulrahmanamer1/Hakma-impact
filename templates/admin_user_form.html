{% extends "base.html" %}
{% block content %}
<div class="page-head"><div><h1>إنشاء حساب إداري</h1><p>أنشئ حسابًا جديدًا وحدد رمز الدخول من هنا.</p></div><a class="secondary" href="{{url_for('admin_users')}}">رجوع</a></div>
<div class="card panel"><form method="post">
<div class="form-grid">
<div class="field"><label>اسم الإداري</label><input name="name" required placeholder="مثال: أحمد علي"></div>
<div class="field"><label>اسم المستخدم</label><input name="username" required placeholder="ahmed.ali"></div>
<div class="field"><label>البريد الإلكتروني (اختياري)</label><input type="email" name="email" placeholder="name@example.com"></div>
<div class="field"><label>الصلاحية</label><select name="role"><option value="ADMIN">ADMIN</option><option value="SUPER_ADMIN">SUPER ADMIN</option></select></div>
<div class="field"><label>رمز الدخول</label><input type="password" name="password" minlength="6" required></div>
<div class="field"><label>تأكيد الرمز</label><input type="password" name="confirm_password" minlength="6" required></div>
<div class="field"><label>المنصب</label><input name="position" value="إداري"></div>
<div class="field"><label>اللجنة</label><input name="committee"></div>
</div>
<div class="field"><label>المسؤوليات</label><textarea name="responsibilities"></textarea></div>
<label style="display:flex;gap:8px;align-items:center;margin:12px 0"><input type="checkbox" name="add_directory" checked> إضافة الاسم أيضًا إلى قائمة الإداريين العامة</label>
<button class="primary">إنشاء الحساب</button>
</form></div>
{% endblock %}
