{% extends "base.html" %}{% block content %}<div class="page-head"><div><h1>منشئ الصفحات</h1><p>أضف صفحات ومحتوى من لوحة الإدارة.</p></div><a class="primary" href="{{url_for('page_new')}}">+ صفحة جديدة</a></div><div class="cards">{% for p in pages %}<div class="card panel"><div class="page-head"><div><h3>{{p['title']}}</h3><small class="muted">/page/{{p['slug']}}</small></div><span class="badge">{{p['status']}}</span></div><div class="actions"><a class="small-btn" href="{{url_for('public_page',slug=p['slug'])}}">عرض</a><a class="small-btn" href="{{url_for('page_edit',pid=p['id'])}}">تعديل</a><form method="post" action="{{url_for('page_delete',pid=p['id'])}}"><button class="small-btn danger">حذف</button></form></div></div>{% else %}<div class="empty">لا توجد صفحات مخصصة.</div>{% endfor %}</div>{% endblock %}
