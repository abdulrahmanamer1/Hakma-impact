{% extends "base.html" %}{% block title %}إدارة الفعاليات — {{team_name}}{% endblock %}{% block content %}<div class="dashboard-topline"><div><span class="eyebrow dark">EVENT MANAGEMENT</span><h1>الفعاليات</h1></div></div><form class="form-card" method="post" enctype="multipart/form-data"><div class="form-grid"><label>العنوان<input name="title" required></label><label>التاريخ<input type="date" name="date"></label><label>الوقت<input type="time" name="time"></label><label>المكان<input name="location"></label><label class="wide">الوصف<textarea name="description"></textarea></label><label class="wide">صورة الغلاف JPG<input type="file" name="cover_file" accept="image/*"></label><label class="wide">صور / فيديوهات متعددة<input type="file" name="media_files" multiple accept="image/*,video/mp4,video/webm,video/quicktime"></label></div><button class="primary-btn" type="submit">إضافة فعالية</button></form><div class="admin-table"><table><tr><th>العنوان</th><th>التاريخ</th><th>المكان</th><th>QR</th><th></th></tr>{% for e in events %}<tr><td>{{e.title}}</td><td>{{e.date}}</td><td>{{e.location}}</td><td>{% if e.qr_path %}<img src="{{url_for('static',filename=e.qr_path)}}" style="width:44px;height:44px;background:#fff;padding:3px;border-radius:7px">{% endif %}</td><td><a class="small-btn" href="{{url_for('qr_scanner',mode='event',record_id=e.id)}}">📷 مسح عضو</a> <form method="post" action="{{url_for('event_delete',eid=e.id)}}" style="display:inline"><button class="small-btn danger">حذف</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
