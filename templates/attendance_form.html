{% extends "base.html" %}
{% block content %}
<div class="page-head"><div><h1>تسجيل حضور يدوي</h1><p>المشرف يختار الشخص، والنظام يسجل وقت الدخول تلقائيًا عند الضغط على حفظ.</p></div></div>
<form method="post" class="form-card">
  <div class="form-grid">
    <div class="field"><label>الشخص</label>
      <select name="person_key" required>
        <option value="">اختر الشخص</option>
        {% for m in members %}<option value="member:{{ m['id'] }}">👥 {{ m['name'] }}</option>{% endfor %}
        {% for a in admins %}<option value="admin:{{ a['id'] }}">🛡️ {{ a['name'] }} — إداري</option>{% endfor %}
        {% for v in temporary %}<option value="temporary:{{ v['id'] }}">🤝 {{ v['name'] }} — متطوع وقتي</option>{% endfor %}
      </select>
    </div>
    <div class="field"><label>الحالة</label>
      <select name="status">
        {% for s in ['Present','Late','Absent','Excused'] %}<option>{{ s }}</option>{% endfor %}
      </select>
    </div>
    <div class="field"><label>المبادرة (اختياري)</label>
      <select name="initiative_id">
        <option value="">بدون مبادرة</option>
        {% for i in initiatives %}<option value="{{ i['id'] }}">{{ i['name'] }}</option>{% endfor %}
      </select>
    </div>
  </div>
  <p class="muted" style="margin:0 0 14px">وقت الدخول لا يُكتب يدويًا؛ يتم تسجيل الوقت الحالي تلقائيًا. عند انتهاء الحضور، اضغط «تسجيل خروج» من سجل الحضور ليحسب النظام الساعات.</p>
  <div class="form-actions">
    <button class="primary" type="submit">تسجيل الدخول الآن</button>
    <a class="secondary" href="{{ url_for('attendance_list') }}">إلغاء</a>
  </div>
</form>
{% endblock %}
