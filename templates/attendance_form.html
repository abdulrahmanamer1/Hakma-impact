{% extends "base.html" %}
{% block content %}
<div class="page-head"><div><h1>تسجيل حضور</h1></div></div>
<form method="post" class="form-card">
  <div class="form-grid">
    <div class="field"><label>العضو</label>
      <select name="member_id">
        {% for m in members %}<option value="{{ m['id'] }}">{{ m['name'] }}</option>{% endfor %}
      </select>
    </div>
    <div class="field"><label>التاريخ</label><input type="date" name="date" value="{{ today }}"></div>
    <div class="field"><label>الحالة</label>
      <select name="status">
        {% for s in ['Present','Absent','Late','Excused'] %}<option>{{ s }}</option>{% endfor %}
      </select>
    </div>
    <div class="field"><label>المبادرة (اختياري)</label>
      <select name="initiative_id">
        <option value="">بدون مبادرة</option>
        {% for i in initiatives %}<option value="{{ i['id'] }}">{{ i['name'] }}</option>{% endfor %}
      </select>
    </div>
  </div>
  <div class="form-actions">
    <button class="primary" type="submit">حفظ</button>
    <a class="secondary" href="{{ url_for('attendance_list') }}">إلغاء</a>
  </div>
</form>
{% endblock %}
