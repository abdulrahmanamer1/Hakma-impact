{% extends "base.html" %}{% block content %}<div class="page-head"><div><h1>💠 الإدارة المالية</h1></div></div><div class="control-card"><form method="post"><select name="entry_type"><option value="income">إيراد</option><option value="expense">مصروف</option></select><input name="title" placeholder="العنوان" required><input type="number" step="0.01" name="amount" placeholder="المبلغ" required><input name="category" placeholder="التصنيف"><input type="date" name="entry_date"><textarea name="description" placeholder="الوصف"></textarea><label><input type="checkbox" name="public"> إظهار للعامة</label><button class="primary">حفظ</button></form></div><div class="control-card">{% for r in rows %}<div class="list-row"><b>{{r.title}}</b><span>{{r.entry_type}} · {{r.amount}} · {{r.entry_date}}</span></div>{% endfor %}</div>{% endblock %}
