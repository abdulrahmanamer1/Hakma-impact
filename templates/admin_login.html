<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دخول الإدارة — {{ team_name }}</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><div class="login-wrap"><div class="login-box"><div style="text-align:center;margin-bottom:22px"><div class="logo-mark">HI</div><h1 style="color:#fff;font-size:21px;margin:0">مركز تحكم {{ team_name }}</h1><p style="color:#B9C6D8;font-size:12px">الوصول محصور بصانع التطبيق والإدارة</p></div><div class="card" style="padding:22px"><form method="post"><input class="auth-input" name="email" type="email" required placeholder="البريد الإداري"><input class="auth-input" name="password" type="password" required placeholder="كلمة المرور"><button class="primary" style="width:100%">دخول مركز التحكم</button></form>{% if not has_admin %}<p class="muted" style="font-size:11px;text-align:center;margin-top:12px">لا يوجد مدير بعد. أنشئ أول حساب إداري من بيئة التشغيل أو قاعدة البيانات قبل استخدام الموقع.</p>{% endif %}</div></div></div></body></html>
