{% extends 'base.html' %}{% block content %}<div class="page-head"><div><h1>🧭 مدير القوائم</h1><p>غيّر أسماء القوائم، ترتيبها، وأي قائمة تظهر للزائر.</p></div></div><form method="post" class="card panel">{% for n in nav_items %}<input type="hidden" name="nav_id" value="{{n['id']}}"><div class="drag-row"><span class="grip">☷</span><input style="flex:1" name="label_{{n['id']}}" value="{{n['label']}}"><input style="width:90px" name="icon_{{n['id']}}" value="{{n['icon']}}"><label class="switch"><input type="checkbox" name="visible_{{n['id']}}" {% if n['visible'] %}checked{% endif %}><i></i></label>{% if not n['is_system'] %}<button formaction="{{url_for('navigation_delete',nid=n['id'])}}" formmethod="post" class="danger">حذف</button>{% endif %}</div>{% endfor %}<hr><h3>إضافة قائمة مخصصة</h3><div class="form-grid"><div class="field"><label>اسم القائمة</label><input name="new_label"></div><div class="field"><label>الرابط</label><input name="new_url" placeholder="/page/example أو https://..."></div><div class="field"><label>الأيقونة</label><input name="new_icon" value="↗"></div></div><button class="primary">حفظ القوائم</button></form>{% endblock %}
