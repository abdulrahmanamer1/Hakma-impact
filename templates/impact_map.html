{% extends "base.html" %}{% block title %}خريطة الأثر — {{ team_name }}{% endblock %}{% block content %}<section class="page-hero"><span class="eyebrow dark">IMPACT MAP</span><h1>خريطة الأثر.</h1><p>اكتشف المبادرات المنفذة، والمواقع التي ستشهد أثرًا قريبًا.</p></section><div class="map-legend"><span>📍 أثر موثق</span><span>🔜 قريبًا</span><span>🗓️ مخطط</span></div><div class="impact-map-page"><div id="fullImpactMap" class="impact-map"></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script>document.addEventListener('DOMContentLoaded',()=>{const map=L.map('fullImpactMap',{scrollWheelZoom:false}).setView([33.3152,44.3661],6);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);const ids={{points|map(attribute='id')|list|tojson}},lat={{points|map(attribute='latitude')|list|tojson}},lng={{points|map(attribute='longitude')|list|tojson}},names={{points|map(attribute='name')|list|tojson}},locs={{points|map(attribute='location')|list|tojson}},sts={{points|map(attribute='map_status')|list|tojson}},notes={{points|map(attribute='map_note')|list|tojson}},dates={{points|map(attribute='map_date')|list|tojson}};let b=[];for(let i=0;i<lat.length;i++){if(lat[i]==null||lng[i]==null)continue;const marker=L.marker([lat[i],lng[i]]).addTo(map);const state=sts[i]==='upcoming'?'🔜 قريبًا':(sts[i]==='planned'?'🗓️ مخطط':'📍 أثر موثق');const note=notes[i]?'<br>'+String(notes[i]):'';const dt=dates[i]?'<br>📅 '+String(dates[i]):'';marker.bindPopup('<b>'+String(names[i]||'مبادرة')+'</b><br>'+String(locs[i]||'')+'<br>'+state+dt+note+'<br><a href="/initiatives/'+String(ids[i])+'">عرض المبادرة</a>');b.push([lat[i],lng[i]])}if(b.length)map.fitBounds(b,{padding:[30,30],maxZoom:12});});</script>{% endblock %}
