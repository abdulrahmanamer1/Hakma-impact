{% extends "base.html" %}{% block content %}<div class="page-head"><div><h1>🎓 إدارة الأكاديمية</h1><a class="secondary" href="{{url_for('academy_payments_admin')}}">💳 طلبات الدفع</a></div></div><div class="admin-grid"><div class="control-card"><h3>إضافة دورة</h3><form method="post" enctype="multipart/form-data"><input type="hidden" name="action" value="course"><input name="title" placeholder="العنوان" required><textarea name="description" placeholder="الوصف"></textarea><input name="instructor" placeholder="المدرب"><input name="level" placeholder="المستوى"><input name="duration" placeholder="المدة"><label><input type="checkbox" name="is_paid"> دورة مدفوعة</label><input name="price_iqd" type="number" min="0" step="1000" placeholder="السعر بالدينار العراقي"><input type="file" name="cover" accept="image/*"><label><input type="checkbox" name="public" checked> نشر للعامة</label><button class="primary">حفظ الدورة</button></form></div><div class="control-card"><h3>إضافة درس</h3><form method="post"><input type="hidden" name="action" value="lesson"><select name="course_id" required>{% for c in courses %}<option value="{{c.id}}">{{c.title}}</option>{% endfor %}</select><input name="title" placeholder="عنوان الدرس"><textarea name="content" placeholder="المحتوى"></textarea><input name="video" placeholder="مسار الفيديو الاختياري"><input name="duration" placeholder="المدة"><input type="number" name="sort_order" value="0"><button class="primary">حفظ الدرس</button></form></div><div class="control-card"><h3>🧠 إضافة اختبار</h3><form method="post"><input type="hidden" name="action" value="quiz"><select name="lesson_id" required>{% for l in lessons %}<option value="{{l.id}}">{{l.title}}</option>{% endfor %}</select><input name="question" placeholder="السؤال" required><input name="options" placeholder="الخيارات مفصولة بعلامة |" required><input type="number" name="answer_index" value="0" min="0"><input type="number" name="points" value="1" min="0"><button class="primary">حفظ الاختبار</button></form></div></div><div class="public-grid">{% for c in courses %}<div class="public-tile"><h2>{{c.title}}</h2><p>{{c.description}}</p></div>{% endfor %}</div>{% endblock %}
