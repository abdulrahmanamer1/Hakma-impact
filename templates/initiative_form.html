{% extends "base.html" %}{% block content %}<div class="page-head"><div><h1>{{ 'تعديل فعالية' if i else 'إضافة فعالية' }}</h1><p>أضف معرض صور كامل للفعالية مباشرة من جهازك.</p></div></div><form method="post" enctype="multipart/form-data" class="form-card"><div class="form-grid"><div class="field"><label>اسم الفعالية</label><input name="name" value="{{ i['name'] if i else '' }}" required></div><div class="field"><label>التاريخ</label><input type="date" name="date" value="{{ i['date'] if i else '' }}"></div><div class="field"><label>المكان</label><input name="location" value="{{ i['location'] if i else '' }}"></div><div class="field"><label>المسؤول</label><select name="manager"><option value="">—</option>{% for m in members %}<option {{ 'selected' if i and i['manager']==m['name'] else '' }}>{{m['name']}}</option>{% endfor %}</select></div><div class="field"><label>اللجنة</label><select name="committee"><option value="">—</option>{% for c in committees %}<option {{ 'selected' if i and i['committee']==c['name'] else '' }}>{{c['name']}}</option>{% endfor %}</select></div><div class="field"><label>ساعات التطوع</label><input type="number" step="0.5" name="hours" value="{{i['hours'] if i else 0}}"></div><div class="field"><label>الحالة</label><select name="status">{% for st in ['Planned','Active','Completed','Cancelled'] %}<option {{'selected' if i and i['status']==st else ''}}>{{st}}</option>{% endfor %}</select></div><div class="field full"><label>الوصف</label><textarea name="description">{{i['description'] if i else ''}}</textarea></div><div class="field full"><label>الأهداف</label><textarea name="goals">{{i['goals'] if i else ''}}</textarea></div></div><div class="upload-box"><label>📸 معرض صور الفعالية</label><input type="file" name="gallery" accept="image/*" multiple><small>يمكنك اختيار عدة صور دفعة واحدة.</small></div>{% if images %}<div class="gallery-grid small-gallery">{% for im in images %}<img src="{{url_for('static',filename=im['path'])}}">{% endfor %}</div>{% endif %}<div class="form-actions"><button class="primary">حفظ الفعالية</button><a class="secondary" href="{{url_for('initiatives_list')}}">إلغاء</a></div></form>{% endblock %}
