{% extends "base.html" %}{% block content %}<div class="container form-page"><h1>إضافة مبادرة / فعالية</h1><form class="form-card" method="post" enctype="multipart/form-data"><div class="form-grid"><label>اسم المبادرة<input name="name" required></label><label>التاريخ<input name="date" type="date"></label><label>الموقع<input name="location"></label><label>المسؤول<input name="manager"></label><label>اللجنة<input name="committee"></label><label>ساعات التطوع<input name="hours" type="number" step="0.5" value="0"></label><label>الحالة<select name="status"><option>Planned</option><option>Active</option><option>Completed</option></select></label><label class="wide">الصور — يمكنك اختيار عدة صور<input name="images" type="file" accept="image/*" multiple></label><label class="wide">الوصف<textarea name="description"></textarea></label><label class="wide">الأهداف<textarea name="goals"></textarea></label></div><button class="btn">حفظ المبادرة</button></form></div>{% endblock %}
