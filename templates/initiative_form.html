{% extends "base.html" %}
{% block content %}
<div class="page-head"><div><h1>{{ 'تعديل مبادرة' if i else 'إضافة مبادرة' }}</h1></div></div>
<form method="post" class="form-card">
  <div class="form-grid">
    <div class="field"><label>اسم المبادرة</label><input name="name" value="{{ i['name'] if i else '' }}" required></div>
    <div class="field"><label>التاريخ</label><input type="date" name="date" value="{{ i['date'] if i else '' }}"></div>
    <div class="field"><label>المكان</label><input name="location" value="{{ i['location'] if i else '' }}"></div><div class="field full"><label>📍 تحديد الموقع مباشرة على الخريطة</label><div id="initiativePicker" class="map-picker"></div><input id="latField" type="hidden" name="latitude" value="{{ i['latitude'] if i and i['latitude'] is not none else '' }}"><input id="lngField" type="hidden" name="longitude" value="{{ i['longitude'] if i and i['longitude'] is not none else '' }}"><small>اضغط على الخريطة أو حرّك السهم لتحديد الموقع.</small></div>
    <div class="field"><label>المسؤول</label>
      <select name="manager">
        <option value="">—</option>
        {% for m in members %}<option {{ 'selected' if i and i['manager']==m['name'] else '' }}>{{ m['name'] }}</option>{% endfor %}
      </select>
    </div>
    <div class="field"><label>اللجنة</label>
      <select name="committee">
        <option value="">—</option>
        {% for c in committees %}<option {{ 'selected' if i and i['committee']==c['name'] else '' }}>{{ c['name'] }}</option>{% endfor %}
      </select>
    </div>
    <div class="field"><label>ساعات التطوع</label><input type="number" step="0.5" name="hours" value="{{ i['hours'] if i else 0 }}"></div>
    <div class="field"><label>الحالة</label>
      <select name="status">
        {% for s in ['Planned','Active','Completed','Cancelled'] %}<option {{ 'selected' if i and i['status']==s else '' }}>{{ s }}</option>{% endfor %}
      </select>
    </div>
    <div class="field"><label>حالة الموقع على خريطة الأثر</label>
      <select name="map_status">
        <option value="completed" {{ 'selected' if not i or i['map_status']=='completed' else '' }}>📍 أثر موثق</option>
        <option value="upcoming" {{ 'selected' if i and i['map_status']=='upcoming' else '' }}>🔜 قريبًا</option>
        <option value="planned" {{ 'selected' if i and i['map_status']=='planned' else '' }}>🗓️ مخطط</option>
      </select>
    </div>
    <div class="field"><label>تاريخ النشاط/الموعد على الخريطة</label><input type="date" name="map_date" value="{{ i['map_date'] if i and i['map_date'] else '' }}"></div>
    <div class="field full"><label>ملاحظة الخريطة</label><input name="map_note" value="{{ i['map_note'] if i and i['map_note'] else '' }}" placeholder="مثال: قريبًا سنطلق مبادرة جديدة هنا"></div>
    <div class="field full"><label class="check-row"><input type="checkbox" name="map_visible" {% if not i or i['map_visible'] != 0 %}checked{% endif %}> إظهار موقع المبادرة على خريطة الأثر العامة</label></div>
    <div class="field full"><label>الوصف</label><textarea name="description">{{ i['description'] if i else '' }}</textarea></div>
    <div class="field full"><label>الأهداف</label><textarea name="goals">{{ i['goals'] if i else '' }}</textarea></div><div class="field full"><label>📸 صور وفيديوهات المبادرة</label><input type="file" name="media_files" multiple accept="image/*,video/mp4,video/webm,video/quicktime"><small>يمكن رفع أكثر من صورة أو فيديو، والصور تحفظ JPG.</small></div>
  </div>
  <div class="form-actions">
    <button class="primary" type="submit">حفظ</button>
    <a class="secondary" href="{{ url_for('initiatives_list') }}">إلغاء</a>
  </div>
</form>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script>document.addEventListener('DOMContentLoaded',()=>{const el=document.getElementById('initiativePicker');if(!el)return;const lat0=parseFloat(document.getElementById('latField').value)||33.3152,lng0=parseFloat(document.getElementById('lngField').value)||44.3661;const map=L.map(el).setView([lat0,lng0],13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);let marker=L.marker([lat0,lng0],{draggable:true}).addTo(map);function set(p){document.getElementById('latField').value=p.lat.toFixed(6);document.getElementById('lngField').value=p.lng.toFixed(6);marker.setLatLng(p)}map.on('click',e=>set(e.latlng));marker.on('dragend',()=>set(marker.getLatLng()));});</script>
{% endblock %}
