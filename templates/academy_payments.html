{% extends "base.html" %}{% block content %}<section class="cinematic-page"><div class="page-head"><h1>🧾 مدفوعاتي</h1></div><div class="public-grid">{% for p in payments %}<article class="public-tile"><h2>{{p.title}}</h2><p>{{"{:,.0f}".format(p.amount or 0)}} د.ع</p><p>الحالة: {{p.status}}</p><p>{{p.created_at}}</p>{% if p.admin_note %}<p>{{p.admin_note}}</p>{% endif %}</article>{% else %}<div class="empty-state">لا توجد عمليات دفع.</div>{% endfor %}</div></section>{% endblock %}
