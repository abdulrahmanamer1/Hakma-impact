{% extends "base.html" %}{% block content %}<div class="container page"><div class="page-head"><div><span class="eyebrow">NEWS</span><h1>الأخبار</h1></div></div><div class="post-grid">{% for n,imgs in data %}<article class="post-card"><div class="post-img">{% if imgs %}<img src="{{url_for('static',filename=imgs[0]['path'])}}">{% else %}<div class="img-placeholder">HIKMA NEWS</div>{% endif %}</div><div class="post-body"><span class="tag">{{n.category}}</span><h3>{{n.title}}</h3><p>{{n.excerpt}}</p><a href="{{url_for('public_news_detail',slug=n.slug)}}">عرض المنشور ←</a></div></article>{% else %}<div class="empty">لا توجد أخبار منشورة.</div>{% endfor %}</div></div>{% endblock %}
