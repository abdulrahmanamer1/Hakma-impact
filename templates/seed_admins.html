{% extends "base.html" %}{% block content %}<div class="container page"><h1>الحسابات التي تم إنشاؤها</h1>{% if created %}<div class="warning">احفظ هذه الرموز الآن؛ لا يتم عرضها مرة ثانية.</div>{% for x in created %}<div class="info-card"><h3>{{x[0]}}</h3><p>البريد: <b>{{x[1]}}</b></p><p>الرمز المؤقت: <code>{{x[2]}}</code></p></div>{% endfor %}{% else %}<p>كل الحسابات موجودة مسبقاً.</p>{% endif %}</div>{% endblock %}
