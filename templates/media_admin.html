{% extends "base.html" %}{% block title %}المعرض — {{ team_name }}{% endblock %}{% block content %}<div class="dashboard-topline"><div><span class="eyebrow dark">MEDIA CENTER</span><h1>إدارة المعرض</h1></div></div><form class="form-card" method="post"><div class="form-grid"><label>العنوان<input name="title" required></label><label>رابط الصورة/الفيديو<input name="url" required></label><label>التصنيف<input name="category"></label><label>المبادرة<select name="initiative_id"><option value="">بدون</option>{% for i in initiatives %}<option value="{{ i.id }}">{{ i.name }}</option>{% endfor %}</select></label></div><button class="primary-btn">إضافة مادة</button></form><div class="admin-table"><table><tr><th>العنوان</th><th>التصنيف</th><th>المبادرة</th></tr>{% for m in media %}<tr><td>{{ m.title }}</td><td>{{ m.category }}</td><td>{{ m.initiative_name or '—' }}</td></tr>{% endfor %}</table></div>{% endblock %}
