{% extends "base.html" %}{% block content %}<article class="container article"><span class="eyebrow">{{n.category}}</span><h1>{{n.title}}</h1><p class="article-meta">{{n.author}} · {{n.published_at}}</p><div class="article-gallery">{% for x in images %}<img src="{{url_for('static',filename=x.path)}}">{% endfor %}</div><div class="article-content">{{n.content|safe}}</div></article>{% endblock %}
