{% extends "base.html" %}
{% block content %}
<div class="page-head"><div><h1>{{ 'تعديل لجنة' if c else 'إضافة لجنة' }}</h1></div></div>
<form method="post" class="form-card">
  <div class="form-grid">
    <div class="field"><label>اسم اللجنة</label><input name="name" value="{{ c['name'] if c else '' }}" required></div>
    <div class="field"><label>رئيس اللجنة</label><input name="head" value="{{ c['head'] if c else '' }}"></div>
    <div class="field full"><label>الوصف</label><textarea name="description">{{ c['description'] if c else '' }}</textarea></div>
  </div>
  <div class="form-actions">
    <button class="primary" type="submit">حفظ</button>
    <a class="secondary" href="{{ url_for('committees_list') }}">إلغاء</a>
  </div>
</form>
{% endblock %}
