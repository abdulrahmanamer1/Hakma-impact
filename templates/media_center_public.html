{% extends "base.html" %}{% block content %}<section class="cinematic-page"><div class="page-head"><div><h1>🎞 مركز الوسائط</h1><p>صور وفيديوهات AHVT وأرشيف الأنشطة.</p></div></div><div class="media-center-grid">{% for m in media %}<article class="media-center-item">{% if m.media_type=='video' %}<video controls src="{{url_for('static',filename=m.url)}}"></video>{% else %}<img src="{{url_for('static',filename=m.url)}}">{% endif %}<h3>{{m.title}}</h3><small>{{m.category}}</small></article>{% else %}<div class="empty-state">لا توجد وسائط منشورة.</div>{% endfor %}</div></section>{% endblock %}
